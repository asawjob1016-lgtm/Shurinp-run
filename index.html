<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🦐 Shrimp Run</title>

<style>
html,body{
margin:0;
padding:0;
overflow:hidden;
background:#0088cc;
font-family:sans-serif;
touch-action:none;
}

canvas{
display:block;
background:linear-gradient(#49b6ff,#006fa8);
}

#menu{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
z-index:10;
}

#menu h1{
font-size:48px;
margin:0;
}

#menu button{
padding:15px 40px;
font-size:24px;
border:none;
border-radius:15px;
margin-top:20px;
}

#gameover{
display:none;
position:absolute;
inset:0;
background:rgba(0,0,0,.7);
color:white;
justify-content:center;
align-items:center;
flex-direction:column;
font-size:24px;
z-index:20;
}
</style>
</head>

<body>

<div id="menu">
<h1>🦐 Shrimp Run</h1>
<p>エビを操作して泳ぎ続けろ！</p>
<button onclick="startGame()">START</button>
</div>

<div id="gameover">
<h2>GAME OVER</h2>
<p id="scoreText"></p>
<button onclick="location.reload()">もう一度</button>
</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let running=false;
let distance=0;
let speed=5;
let hitCount=0;

let bestScore=
parseInt(localStorage.getItem("shrimpBest")||0);

const shrimp={
x:120,
y:300,
w:60,
h:40,
vy:0,
flash:0
};

const obstacles=[];

function startGame(){
document.getElementById("menu").style.display="none";
running=true;
requestAnimationFrame(loop);
}

function createObstacle(){

let type=Math.random();

let y=
100+
Math.random()*
(canvas.height-220);

obstacles.push({
x:canvas.width+100,
y:y,
w:50,
h:50,
type:type
});
}

setInterval(()=>{
if(running){
createObstacle();
}
},1400);

let lastTap=0;

canvas.addEventListener("touchstart",(e)=>{

e.preventDefault();

let now=Date.now();

if(now-lastTap<250){
shrimp.vy=-18;
}else{
shrimp.vy=-10;
}

lastTap=now;
});

let startY=0;

canvas.addEventListener("touchstart",(e)=>{
startY=e.touches[0].clientY;
});

canvas.addEventListener("touchend",(e)=>{

let endY=
e.changedTouches[0].clientY;

if(endY-startY>80){
shrimp.vy=12;
}
});

function collision(a,b){
return(
a.x<b.x+b.w &&
a.x+a.w>b.x &&
a.y<b.y+b.h &&
a.y+a.h>b.y
);
}

function gameOver(){

running=false;

if(distance>bestScore){
bestScore=Math.floor(distance);
localStorage.setItem(
"shrimpBest",
bestScore
);
}

document.getElementById(
"scoreText"
).innerHTML=
`
距離: ${Math.floor(distance)}m<br>
最高記録: ${bestScore}m
`;

document.getElementById(
"gameover"
).style.display="flex";
}

function drawShrimp(){

    ctx.save();

    if(shrimp.flash>0){
        ctx.globalAlpha=Math.sin(shrimp.flash)*0.5+0.5;
        shrimp.flash-=0.3;
    }

    const x=shrimp.x;
    const y=shrimp.y;

    const swim=Math.sin(Date.now()/120)*2;

    ctx.translate(x,y+swim);

    ctx.strokeStyle="#ff7a59";
    ctx.lineWidth=3;
    ctx.lineCap="round";
    ctx.lineJoin="round";

    // 触角
    ctx.beginPath();
    ctx.moveTo(5,-2);
    ctx.quadraticCurveTo(20,-18,40,-10);
    ctx.moveTo(5,2);
    ctx.quadraticCurveTo(18,10,35,15);
    ctx.stroke();

    // 本体
    ctx.beginPath();

    // 頭
    ctx.moveTo(-18,-2);

    // 頭上
    ctx.quadraticCurveTo(
        -5,-15,
        15,-10
    );

    // 背中
    ctx.quadraticCurveTo(
        35,-5,
        38,10
    );

    // 腰曲がり
    ctx.quadraticCurveTo(
        30,25,
        12,20
    );

    // 腹
    ctx.quadraticCurveTo(
        -2,15,
        -18,-2
    );

    ctx.stroke();

    // 節
    ctx.beginPath();
    ctx.moveTo(12,-8);
    ctx.lineTo(12,18);

    ctx.moveTo(24,-3);
    ctx.lineTo(22,21);

    ctx.moveTo(32,5);
    ctx.lineTo(26,19);
    ctx.stroke();

    // 尻尾
    ctx.beginPath();

    ctx.moveTo(35,10);
    ctx.lineTo(48,2);

    ctx.moveTo(35,10);
    ctx.lineTo(47,18);

    ctx.stroke();

    // 足
    ctx.beginPath();

    ctx.moveTo(0,12);
    ctx.lineTo(-5,20);

    ctx.moveTo(8,14);
    ctx.lineTo(2,24);

    ctx.moveTo(16,15);
    ctx.lineTo(10,25);

    ctx.stroke();

    // 目
    ctx.fillStyle="black";
    ctx.beginPath();
    ctx.arc(-2,-3,2,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
}

function drawObstacle(o){

if(o.type<0.33){

ctx.fillStyle="orange";

ctx.beginPath();
ctx.arc(
o.x,
o.y,
20,
0,
Math.PI*2
);
ctx.fill();

}else if(o.type<0.66){

ctx.fillStyle="gray";

ctx.fillRect(
o.x-20,
canvas.height-80,
40,
40
);

o.y=canvas.height-60;

}else{

ctx.fillStyle="#ffeeaa";

ctx.beginPath();
ctx.arc(
o.x,
o.y,
18,
0,
Math.PI
);
ctx.fill();
}
}

function update(){

distance+=0.1;

shrimp.vy+=0.7;
shrimp.y+=shrimp.vy;

if(shrimp.y<40){
shrimp.y=40;
}

if(shrimp.y>
canvas.height-50){
shrimp.y=
canvas.height-50;
}

for(let i=obstacles.length-1;i>=0;i--){

let o=obstacles[i];

o.x-=speed;

if(collision(
{
x:shrimp.x-25,
y:shrimp.y-20,
w:50,
h:40
},
{
x:o.x-20,
y:o.y-20,
w:40,
h:40
}
)){

obstacles.splice(i,1);

hitCount++;

shrimp.flash=10;

if(hitCount>=2){
gameOver();
}
continue;
}

if(o.x<-100){
obstacles.splice(i,1);
}
}
}

function draw(){

ctx.clearRect(
0,0,
canvas.width,
canvas.height
);

ctx.fillStyle=
"rgba(255,255,255,.15)";

for(let i=0;i<20;i++){
ctx.fillRect(
(i*120+
(Date.now()/20)%120),
50,
60,
3
);
}

ctx.fillStyle="#d6c37c";
ctx.fillRect(
0,
canvas.height-40,
canvas.width,
40
);

drawShrimp();

obstacles.forEach(drawObstacle);

ctx.fillStyle="white";
ctx.font="24px sans-serif";

ctx.fillText(
`距離 ${Math.floor(distance)}m`,
20,
40
);

ctx.fillText(
`❤️ ${2-hitCount}`,
20,
75
);

ctx.fillText(
`BEST ${bestScore}m`,
20,
110
);
}

function loop(){

if(!running) return;

update();
draw();

requestAnimationFrame(loop);
}

</script>
</body>
</html>
