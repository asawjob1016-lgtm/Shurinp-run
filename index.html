<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>🦐 Shrimp Run</title>

<style>

html,body{
margin:0;
padding:0;
overflow:hidden;
touch-action:none;
font-family:sans-serif;
background:#0069c9;
}

canvas{
display:block;
background:
linear-gradient(
180deg,
#67c7ff 0%,
#0084d6 100%
);
}

#menu{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
z-index:20;
}

#title{
font-size:56px;
font-weight:bold;
margin-bottom:15px;
}

#subtitle{
font-size:18px;
margin-bottom:30px;
}

button{
font-size:24px;
padding:15px 40px;
border:none;
border-radius:20px;
background:white;
}

#gameover{
display:none;
position:absolute;
inset:0;
background:rgba(0,0,0,.7);
color:white;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:30;
}

#scoreText{
font-size:24px;
margin:20px;
text-align:center;
}

</style>
</head>

<body>

<div id="menu">

<div id="title">🦐 Shrimp Run</div>

<div id="subtitle">
エビを操作して泳ぎ続けよう
</div>

<button onclick="startGame()">
START
</button>

</div>

<div id="gameover">

<h1>GAME OVER</h1>

<div id="scoreText"></div>

<button onclick="restartGame()">
もう一度
</button>

</div>

<canvas id="game"></canvas>

<script>

const canvas=
document.getElementById("game");

const ctx=
canvas.getContext("2d");

function resize(){

canvas.width=
window.innerWidth;

canvas.height=
window.innerHeight;

groundY=
canvas.height-120;
}

window.addEventListener(
"resize",
resize
);

let groundY=0;

resize();

let running=false;

let distance=0;

let bestScore=
parseInt(
localStorage.getItem(
"shrimpBest"
)||0
);

let hitCount=0;

let speed=6;

let shrimp={
x:120,
y:300,
vy:0
};

let obstacles=[];

let touchStartY=0;

function startGame(){

document.getElementById(
"menu"
).style.display="none";

running=true;

distance=0;
speed=6;
hitCount=0;

obstacles=[];

shrimp.y=
canvas.height/2;

shrimp.vy=0;

loop();
}

function restartGame(){

document.getElementById(
"gameover"
).style.display="none";

startGame();
}

canvas.addEventListener(
"touchstart",
e=>{

touchStartY=
e.touches[0].clientY;

}
);

canvas.addEventListener(
"touchend",
e=>{

if(!running)return;

let endY=
e.changedTouches[0].clientY;

let diff=
endY-touchStartY;

if(diff<-60){

shrimp.vy=-12;

}else if(diff>60){

shrimp.vy=12;

}else{

shrimp.vy=-8;
}

}
);

function updateShrimp(){

shrimp.vy+=0.5;

shrimp.y+=shrimp.vy;

if(shrimp.y<40)
shrimp.y=40;

if(shrimp.y>
groundY-60)
shrimp.y=
groundY-60;
}

function drawBackground(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

let wave=
Math.sin(
Date.now()*0.002
)*5;

ctx.fillStyle=
"#f5d08a";

ctx.fillRect(
0,
groundY+wave,
canvas.width,
canvas.height
);

ctx.fillStyle=
"rgba(255,255,255,.15)";

for(let i=0;i<20;i++){

ctx.beginPath();

ctx.arc(
(i*200+
Date.now()*0.05)
%(
canvas.width+200
),
100+
Math.sin(i)*50,
20,
0,
Math.PI*2
);

ctx.fill();
}

ctx.fillStyle="white";

ctx.font=
"bold 28px sans-serif";

ctx.fillText(
Math.floor(distance)+"m",
20,
40
);

ctx.fillText(
"❤️ "+(2-hitCount),
20,
80
);

ctx.fillText(
"BEST "+bestScore+"m",
20,
120
);
}
