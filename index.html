<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>🦐 Shrimp Run</title>

<style>

html,body{
margin:0;
padding:0;
overflow:hidden;
font-family:sans-serif;
background:#006cb8;

}

canvas{
display:block;
background:
linear-gradient(
180deg,
#69c6ff 0%,
#0088dd 100%

}

#menu{
