<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>エビラン</title>

<style>
body{
  font-family:sans-serif;
  background:#4fd3ff;
  color:white;
  text-align:center;
  margin:0;
  padding:20px;
}

.card{
  background:white;
  color:#333;
  border-radius:15px;
  padding:20px;
  margin:20px auto;
  max-width:400px;
}

input{
  width:90%;
  padding:10px;
  margin:10px 0;
}

button{
  background:#ff7b00;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:10px;
  font-size:16px;
}

li{
  text-align:left;
  margin:8px 0;
}
</style>
</head>

<body>

<h1>🦐 エビラン</h1>
<p>ランニング記録アプリ</p>

<div class="card">
<h2>今日の記録</h2>

<input id="distance" type="number" placeholder="距離(km)">
<br>

<input id="time" type="number" placeholder="時間(分)">
<br>

<button onclick="saveRun()">保存</button>
</div>

<div class="card">
<h2>記録一覧</h2>
<ul id="list"></ul>
</div>

<script>
function saveRun(){

  const distance =
    document.getElementById("distance").value;

  const time =
    document.getElementById("time").value;

  if(!distance || !time){
    alert("入力してください");
    return;
  }

  const runs =
    JSON.parse(localStorage.getItem("runs")) || [];

  runs.push({
    distance: distance,
    time: time,
    date: new Date().toLocaleDateString()
  });

  localStorage.setItem(
    "runs",
    JSON.stringify(runs)
  );

  showRuns();

  document.getElementById("distance").value="";
  document.getElementById("time").value="";
}

function showRuns(){

  const runs =
    JSON.parse(localStorage.getItem("runs")) || [];

  let html="";

  runs.reverse().forEach(run=>{
    html += `<li>${run.date} - ${run.distance}km - ${run.time}分</li>`;
  });

  document.getElementById("list").innerHTML = html;
}

showRuns();
</script>

</body>
</html>
