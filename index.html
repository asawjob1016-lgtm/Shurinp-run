<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shrimp🦐Run</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:sans-serif;
background:#003b66;
touch-action:none;
}

canvas{
display:block;
width:100vw;
height:100vh;
}

#menu{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:
linear-gradient(
180deg,
#4ec9ff 0%,
#006bb3 100%
);
color:white;
z-index:10;
}

#title{
font-size:56px;
font-weight:bold;
margin-bottom:15px;
text-shadow:0 0 10px rgba(0,0,0,.3);
}

#subtitle{
font-size:18px;
margin-bottom:30px;
}

#startBtn{
padding:16px 40px;
font-size:24px;
border:none;
border-radius:18px;
background:white;
color:#006bb3;
font-weight:bold;
}

#gameover{
display:none;
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.75);
color:white;
z-index:20;

justify-content:center;
align-items:center;
flex-direction:column;
}

#scoreText{
font-size:24px;
margin:20px;
text-align:center;
}

#retryBtn{
padding:16px 40px;
font-size:24px;
border:none;
border-radius:18px;
}

</style>
</head>
<body>

<div id="menu">

<div id="title">
🦐 Shrimp Run
</div>

<div id="subtitle">
どこまで泳げる？
</div>

<button id="startBtn">
START
</button>

</div>

<div id="gameover">

<h1>GAME OVER</h1>

<div id="scoreText"></div>

<button id="retryBtn">
RETRY
</button>

</div>

<canvas id="game"></canvas>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

function resize(){

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

window.addEventListener(
"resize",
resize
);

resize();

console.log(
"PART1 OK"
);

let gameStarted=false;

let distance=0;

let bubbles=[];

let waves=0;

let shrimp={

x:140,

y:0,

targetY:0,

flash:0,

invincible:0

};

function startGame(){

document.getElementById(
"menu"
).style.display="none";

gameStarted=true;

distance=0;

shrimp.y=
canvas.height/2;

shrimp.targetY=
shrimp.y;

requestAnimationFrame(loop);

}

document
.getElementById("startBtn")
.addEventListener(
"click",
startGame
);

function createBubble(){

bubbles.push({

x:
Math.random()*canvas.width,

y:
canvas.height+20,

size:
10+Math.random()*20,

speed:
1+Math.random()*2

});

}

for(let i=0;i<20;i++){

createBubble();

}

function drawBackground(){

const grad=
ctx.createLinearGradient(
0,
0,
0,
canvas.height
);

grad.addColorStop(
0,
"#69d2ff"
);

grad.addColorStop(
1,
"#0069b8"
);

ctx.fillStyle=grad;

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

waves+=0.03;

ctx.fillStyle=
"rgba(255,255,255,.15)";

for(let x=0;
x<canvas.width;
x+=40){

const y=
80+
Math.sin(
x*0.01+
waves
)*10;

ctx.beginPath();

ctx.arc(
x,
y,
8,
0,
Math.PI*2
);

ctx.fill();

}

for(let b of bubbles){

ctx.fillStyle=
"rgba(255,255,255,.3)";

ctx.beginPath();

ctx.arc(
b.x,
b.y,
b.size,
0,
Math.PI*2
);

ctx.fill();

b.y-=b.speed;

if(b.y<-50){

b.y=
canvas.height+50;

b.x=
Math.random()*
canvas.width;

}

}

ctx.fillStyle=
"#d9c28a";

ctx.fillRect(

0,

canvas.height-90,

canvas.width,

90

);

}
</script>

</body>
</html>
