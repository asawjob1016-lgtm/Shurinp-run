<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shrimp🦐Run</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:sans-serif;
background:#003b66;
touch-action:none;
}

canvas{
display:block;
width:100vw;
height:100vh;
}

#menu{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:
linear-gradient(
180deg,
#4ec9ff 0%,
#006bb3 100%
);
color:white;
z-index:10;
}

#title{
font-size:56px;
font-weight:bold;
margin-bottom:15px;
text-shadow:0 0 10px rgba(0,0,0,.3);
}

#subtitle{
font-size:18px;
margin-bottom:30px;
}

#startBtn{
padding:16px 40px;
font-size:24px;
border:none;
border-radius:18px;
background:white;
color:#006bb3;
font-weight:bold;
}

#gameover{
display:none;
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.75);
color:white;
z-index:20;

justify-content:center;
align-items:center;
flex-direction:column;
}

#scoreText{
font-size:24px;
margin:20px;
text-align:center;
}

#retryBtn{
padding:16px 40px;
font-size:24px;
border:none;
border-radius:18px;
}

</style>
</head>
<body>

<div id="menu">

<div id="title">
🦐 Shrimp Run
</div>

<div id="subtitle">
どこまで泳げる？
</div>

<button id="startBtn">
START
</button>

</div>

<div id="gameover">

<h1>GAME OVER</h1>

<div id="scoreText"></div>

<button id="retryBtn">
RETRY
</button>

</div>

<canvas id="game"></canvas>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

function resize(){

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

window.addEventListener(
"resize",
resize
);

resize();

console.log(
"PART1 OK"
);

</script>

</body>
</html>
