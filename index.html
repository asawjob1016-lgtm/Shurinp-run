<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🦐 Shrimp Run</title>

<style>
html,body{
margin:0;
padding:0;
overflow:hidden;
background:#0088cc;
font-family:sans-serif;
touch-action:none;
}

canvas{
display:block;
background:linear-gradient(#49b6ff,#006fa8);
}

#menu{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
z-index:10;
}

#menu h1{
font-size:48px;
margin:0;
}

#menu button{
padding:15px 40px;
font-size:24px;
border:none;
border-radius:15px;
margin-top:20px;
}

#gameover{
display:none;
position:absolute;
inset:0;
background:rgba(0,0,0,.7);
color:white;
justify-content:center;
align-items:center;
flex-direction:column;
font-size:24px;
z-index:20;
}
</style>
</head>

<body>

<div id="menu">
<h1>🦐 Shrimp Run</h1>
<p>エビを操作して泳ぎ続けろ！</p>
<button onclick="startGame()">START</button>
</div>

<div id="gameover">
<h2>GAME OVER</h2>
<p id="scoreText"></p>
<button onclick="location.reload()">もう一度</button>
</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let running=false;
let distance=0;
let speed=5;
let hitCount=0;

let bestScore=
parseInt(localStorage.getItem("shrimpBest")||0);

const shrimp={
x:120,
y:300,
w:60,
h:40,
vy:0,
flash:0
};

const obstacles=[];

function startGame(){
document.getElementById("menu").style.display="none";
running=true;
requestAnimationFrame(loop);
}

function createObstacle(){

let type=Math.random();

let y=
100+
Math.random()*
(canvas.height-220);

obstacles.push({
x:canvas.width+100,
y:y,
w:50,
h:50,
type:type
});
}

setInterval(()=>{
if(running){
createObstacle();
}
},1400);

let lastTap=0;

canvas.addEventListener("touchstart",(e)=>{

e.preventDefault();

let now=Date.now();

if(now-lastTap<250){
shrimp.vy=-18;
}else{
shrimp.vy=-10;
}

lastTap=now;
});

let startY=0;

canvas.addEventListener("touchstart",(e)=>{
startY=e.touches[0].clientY;
});

canvas.addEventListener("touchend",(e)=>{

let endY=
e.changedTouches[0].clientY;

if(endY-startY>80){
shrimp.vy=12;
}
});

function collision(a,b){
return(
a.x<b.x+b.w &&
a.x+a.w>b.x &&
a.y<b.y+b.h &&
a.y+a.h>b.y
);
}

function gameOver(){

running=false;

if(distance>bestScore){
bestScore=Math.floor(distance);
localStorage.setItem(
"shrimpBest",
bestScore
);
}

document.getElementById(
"scoreText"
).innerHTML=
`
距離: ${Math.floor(distance)}m<br>
最高記録: ${bestScore}m
`;

document.getElementById(
"gameover"
).style.display="flex";
}

function drawShrimp(){

ctx.save();

if(shrimp.flash>0){
ctx.globalAlpha=Math.sin(shrimp.flash)*0.5+0.5;
shrimp.flash-=0.3;
}

const x=shrimp.x;
const y=shrimp.y;

const tail=Math.sin(Date.now()/120)*8;

// 触角
ctx.strokeStyle="#ff9b7a";
ctx.lineWidth=3;

ctx.beginPath();
ctx.moveTo(x+25,y-12);
ctx.quadraticCurveTo(x+60,y-45,x+90,y-20);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(x+20,y-2);
ctx.quadraticCurveTo(x+55,y-15,x+85,y+10);
ctx.stroke();

ctx.fillStyle="#ff8a65";

// 胴体（エビっぽく曲げる）
ctx.beginPath();

ctx.moveTo(x-25,y);

ctx.quadraticCurveTo(
x-10,
y-20,
x+10,
y-15
);

ctx.quadraticCurveTo(
x+35,
y-10,
x+40,
y+5
);

ctx.quadraticCurveTo(
x+20,
y+20,
x-10,
y+15
);

ctx.quadraticCurveTo(
x-25,
y+10,
x-25,
y
);

ctx.fill();

// 頭
ctx.beginPath();
ctx.arc(
x+40,
y,
18,
0,
Math.PI*2
);
ctx.fill();

// しっぽ
ctx.beginPath();
ctx.moveTo(x-25,y);

ctx.lineTo(
x-55,
y-18-tail
);

ctx.lineTo(
x-45,
y
);

ctx.lineTo(
x-55,
y+18+tail
);

ctx.closePath();
ctx.fill();

// 足
ctx.strokeStyle="#ff7043";
ctx.lineWidth=2;

for(let i=0;i<5;i++){

ctx.beginPath();

ctx.moveTo(
x-5+(i*8),
y+10
);

ctx.lineTo(
x-15+(i*8),
y+20
);

ctx.stroke();
}

// 目（大きめ）
ctx.fillStyle="white";

ctx.beginPath();
ctx.arc(
x+47,
y-6,
6,
0,
Math.PI*2
);
ctx.fill();

ctx.fillStyle="black";

ctx.beginPath();
ctx.arc(
x+49,
y-6,
2.5,
0,
Math.PI*2
);
ctx.fill();

// ほっぺ
ctx.fillStyle="#ffb3b3";

ctx.beginPath();
ctx.arc(
x+35,
y+6,
4,
0,
Math.PI*2
);
ctx.fill();

ctx.restore();
}

function drawObstacle(o){

if(o.type<0.33){

ctx.fillStyle="orange";

ctx.beginPath();
ctx.arc(
o.x,
o.y,
20,
0,
Math.PI*2
);
ctx.fill();

}else if(o.type<0.66){

ctx.fillStyle="gray";

ctx.fillRect(
o.x-20,
canvas.height-80,
40,
40
);

o.y=canvas.height-60;

}else{

ctx.fillStyle="#ffeeaa";

ctx.beginPath();
ctx.arc(
o.x,
o.y,
18,
0,
Math.PI
);
ctx.fill();
}
}

function update(){

distance+=0.1;

shrimp.vy+=0.7;
shrimp.y+=shrimp.vy;

if(shrimp.y<40){
shrimp.y=40;
}

if(shrimp.y>
canvas.height-50){
shrimp.y=
canvas.height-50;
}

for(let i=obstacles.length-1;i>=0;i--){

let o=obstacles[i];

o.x-=speed;

if(collision(
{
x:shrimp.x-25,
y:shrimp.y-20,
w:50,
h:40
},
{
x:o.x-20,
y:o.y-20,
w:40,
h:40
}
)){

obstacles.splice(i,1);

hitCount++;

shrimp.flash=10;

if(hitCount>=2){
gameOver();
}
continue;
}

if(o.x<-100){
obstacles.splice(i,1);
}
}
}

function draw(){

ctx.clearRect(
0,0,
canvas.width,
canvas.height
);

ctx.fillStyle=
"rgba(255,255,255,.15)";

for(let i=0;i<20;i++){
ctx.fillRect(
(i*120+
(Date.now()/20)%120),
50,
60,
3
);
}

ctx.fillStyle="#d6c37c";
ctx.fillRect(
0,
canvas.height-40,
canvas.width,
40
);

drawShrimp();

obstacles.forEach(drawObstacle);

ctx.fillStyle="white";
ctx.font="24px sans-serif";

ctx.fillText(
`距離 ${Math.floor(distance)}m`,
20,
40
);

ctx.fillText(
`❤️ ${2-hitCount}`,
20,
75
);

ctx.fillText(
`BEST ${bestScore}m`,
20,
110
);
}

function loop(){

if(!running) return;

update();
draw();

requestAnimationFrame(loop);
}

</script>
</body>
</html>
