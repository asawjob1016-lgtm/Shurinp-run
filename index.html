<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shrimp🦐Run</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:sans-serif;
background:#003b66;
touch-action:none;
}

canvas{
display:block;
width:100vw;
height:100vh;
}

#menu{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  background:
  linear-gradient(
    180deg,
    #5fd3ff 0%,
    #0094ff 60%,
    #0066b3 100%
  );

  color:white;
  z-index:10;
}

#title{
  font-size:56px;
  font-weight:bold;
  margin-bottom:25px;
  text-shadow:0 4px 12px rgba(0,0,0,.3);
}

#menuShrimp{
  width:170px;
  height:auto;
  margin-bottom:25px;
}

#subtitle{
  font-size:28px;
  margin-bottom:40px;
  text-shadow:0 2px 8px rgba(0,0,0,.3);
}

#startBtn{
  padding:20px 90px;
  font-size:42px;
  font-weight:bold;

  border:none;
  border-radius:30px;

  background:white;
  color:#0066cc;

  box-shadow:
  0 10px 20px rgba(0,0,0,.2);

  cursor:pointer;
}

#gameover{
display:none;
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.75);
color:white;
z-index:20;

justify-content:center;
align-items:center;
flex-direction:column;
}

#scoreText{
font-size:24px;
margin:20px;
text-align:center;
}

#retryBtn{
padding:16px 40px;
font-size:24px;
border:none;
border-radius:18px;
}

</style>
</head>
<body>

<div id="menu">

  <div id="title">
    Shrimp Run
  </div>

  <canvas id="menuShrimp" width="240" height="120"></canvas>

  <div id="subtitle">
    どこまで泳げる？
  </div>

  <button id="startBtn">
    START
  </button>

</div>

<div id="gameover">

<h1>GAME OVER</h1>

<div id="scoreText"></div>

<button id="retryBtn">
RETRY
</button>

</div>

<canvas id="game"></canvas>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

function resize(){

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

window.addEventListener(
"resize",
resize
);

resize();

console.log(
"PART1 OK"
);

drawMenuShrimp();

let gameStarted=false;

let distance=0;

let bubbles=[];

let waves=0;

let obstacles=[];
let obstacleTimer=0;


let hits=0;

let speed=6;

let nextSpawn=0;

let shrimp={

x:140,

y:0,

targetY:0,

flash:0,

invincible:0

};

function startGame(){

document.getElementById(
"menu"
).style.display="none";

gameStarted=true;

distance=0;

shrimp.y=
canvas.height/2;

shrimp.targetY=
shrimp.y;

requestAnimationFrame(loop);

}

document
.getElementById("startBtn")
.addEventListener(
"click",
startGame
);

document
.getElementById("retryBtn")
.addEventListener("click",()=>{

  document.getElementById(
    "gameover"
  ).style.display="none";

  obstacles.length=0;
  bubbles.length=0;

  for(let i=0;i<20;i++){
    createBubble();
  }

  hits=0;

  startGame();

});

function gameOver(){

  gameStarted=false;

  document.getElementById(
    "scoreText"
  ).textContent =
    "距離 : " +
    Math.floor(distance) +
    "m";

  document.getElementById(
    "gameover"
  ).style.display="flex";
}

function getObstacleType(){

if(distance<300){

const types=[
"🐚",
"🪨",
"🐟",
"🐠",
"🐡"
];

return types[
Math.floor(
Math.random()*types.length
)
];

}

if(distance<700){

const types=[
"🐚",
"🪨",
"🐟",
"🐠",
"🐡",
"🐙",
"🦑",
"🌿",
"🪸"
];

return types[
Math.floor(
Math.random()*types.length
)
];

}

if(distance<1000){

const types=[
"🐚",
"🪨",
"🐟",
"🐠",
"🐡",
"🐙",
"🦑",
"🌿",
"🪸",
"🪝"
];

return types[
Math.floor(
Math.random()*types.length
)
];

}

const types=[
"🐚",
"🪨",
"🐟",
"🐠",
"🐡",
"🐙",
"🦑",
"🌿",
"🪸",
"🪝",
"🕸️"
];

return types[
Math.floor(
Math.random()*types.length
)
];

}

function spawnObstacle(){

const type=getObstacleType();

let y;

if(
type==="🪨"||
type==="🐚"||
type==="🌿"||
type==="🪸"
){

y=canvas.height-140;

}else if(type==="🪝"){

y=0;

}else if(type==="🕸️"){

y=50;

}else{

y=
100+
Math.random()*
(canvas.height-300);

}

obstacles.push({

type:type,

x:canvas.width+100,

y:y,

size:
(
type==="🐙" ||
type==="🦑"
)
?80:60

});

}

function createBubble(){

bubbles.push({

x:
Math.random()*canvas.width,

y:
canvas.height+20,

size:
10+Math.random()*20,

speed:
1+Math.random()*2

});

}

for(let i=0;i<20;i++){

createBubble();

}

function createObstacle(){

let type;

const r=Math.random();

if(r<0.4){

type="🐟";

}else if(r<0.7){

type="🐚";

}else{

type="🪨";

}

let y;

if(type==="🐟"){

y=
100+
Math.random()*
(canvas.height-300);

}else{

y=
canvas.height-120;

}

obstacles.push({

type:type,

x:canvas.width+100,

y:y,

size:60

});

}

function updateObstacles(){

obstacleTimer++;

if(obstacleTimer>90){

spawnObstacle();

obstacleTimer=0;

}

for(let i=obstacles.length-1;i>=0;i--){

obstacles[i].x-=8;

if(obstacles[i].x<-100){

obstacles.splice(i,1);

}

}

}

function drawObstacles(){

for(const o of obstacles){

ctx.font="80px serif";

ctx.fillText(
o.type,
o.x,
o.y
);

}

}

function checkCollision(){

for(const o of obstacles){

const dx=Math.abs(
(shrimp.x+20)-o.x
);

const dy=Math.abs(
(shrimp.y+20)-o.y
);

if(dx<45 && dy<45){

if(shrimp.invincible>0){
continue;
}

hits++;

shrimp.flash=60;

shrimp.invincible=90;

if(hits>=2){

gameOver();

return;

}

}

}

}

function drawBackground(){

const grad=
ctx.createLinearGradient(
0,
0,
0,
canvas.height
);

grad.addColorStop(
0,
"#69d2ff"
);

grad.addColorStop(
1,
"#0069b8"
);

ctx.fillStyle=grad;

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

waves+=0.03;

ctx.fillStyle=
"rgba(255,255,255,.15)";

for(let x=0;
x<canvas.width;
x+=40){

const y=
80+
Math.sin(
x*0.01+
waves
)*10;

ctx.beginPath();

ctx.arc(
x,
y,
8,
0,
Math.PI*2
);

ctx.fill();

}

for(let b of bubbles){

ctx.fillStyle=
"rgba(255,255,255,.3)";

ctx.beginPath();

ctx.arc(
b.x,
b.y,
b.size,
0,
Math.PI*2
);

ctx.fill();

b.y-=b.speed;

if(b.y<-50){

b.y=
canvas.height+50;

b.x=
Math.random()*
canvas.width;

}

}

ctx.fillStyle=
"#d9c28a";

ctx.fillRect(

0,

canvas.height-90,

canvas.width,

90

);

}

function drawShrimpShape(ctx){

  const tail=
  Math.sin(Date.now()*0.01)*4;

  // 触角
  ctx.strokeStyle="#ff9a6b";
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.moveTo(-8,-6);
  ctx.quadraticCurveTo(-40,-30,-70,-15);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(-8,0);
  ctx.quadraticCurveTo(-45,10,-75,15);
  ctx.stroke();

  // 胴体
  ctx.strokeStyle="#ff8c66";
  ctx.lineWidth=7;
  ctx.fillStyle="#ff6347";

  ctx.beginPath();
  ctx.arc(0,0,24,1.2,5.9);
  ctx.fill();
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(20,10,18,1.2,5.8);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(38,22,14,1.1,5.7);
  ctx.stroke();

  // 尻尾
  ctx.fillStyle="#ff8c66";

  ctx.beginPath();
  ctx.moveTo(55,26);
  ctx.lineTo(80,16-tail);
  ctx.lineTo(72,28);
  ctx.lineTo(80,42+tail);
  ctx.closePath();
  ctx.fill();

  // 目
  ctx.fillStyle="black";

  ctx.beginPath();
  ctx.arc(-4,-8,2.5,0,Math.PI*2);
  ctx.fill();
}

function drawShrimp(){

if(
shrimp.invincible>0 &&
Math.floor(shrimp.invincible/8)%2
){
return;
}

ctx.save();

ctx.translate(
shrimp.x,
shrimp.y
);

const tail=
Math.sin(
Date.now()*0.01
)*4;

// 触角
ctx.strokeStyle="#ff9a6b";
ctx.lineWidth=3;

ctx.beginPath();

ctx.moveTo(-8,-6);

ctx.quadraticCurveTo(
-40,-30,
-70,-15
);

ctx.stroke();

ctx.beginPath();

ctx.moveTo(-8,0);

ctx.quadraticCurveTo(
-45,10,
-75,15
);

ctx.stroke();

// 胴体
ctx.strokeStyle="#ff8c66";
ctx.lineWidth=7;
ctx.fillStyle="#ff6347";

ctx.beginPath();

ctx.arc(
0,
0,
24,
1.2,
5.9
);

ctx.fill();
ctx.stroke();

ctx.beginPath();

ctx.arc(
20,
10,
18,
1.2,
5.8
);

ctx.stroke();

ctx.beginPath();

ctx.arc(
38,
22,
14,
1.1,
5.7
);

ctx.stroke();

// 尻尾
ctx.fillStyle="#ff8c66";

ctx.beginPath();

ctx.moveTo(
55,
26
);

ctx.lineTo(
80,
16-tail
);

ctx.lineTo(
72,
28
);

ctx.lineTo(
80,
42+tail
);

ctx.closePath();

ctx.fill();

// 目
ctx.fillStyle="black";

ctx.beginPath();

ctx.arc(
-4,
-8,
2.5,
0,
Math.PI*2
);

ctx.fill();

ctx.restore();

}

function drawUI(){

ctx.fillStyle="white";

ctx.font=
"bold 28px sans-serif";

ctx.fillText(
Math.floor(distance)+"m",
20,
40
);

ctx.fillText(
"❤️".repeat(
Math.max(0,2-hits)
),
20,
80
);

}

function drawMenuShrimp(){

  const canvas =
  document.getElementById("menuShrimp");

  const ctx =
  canvas.getContext("2d");

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.save();

  ctx.translate(60,60);
  ctx.scale(1.5,1.5);

  drawShrimpShape(ctx);

  ctx.restore();
}

function updateShrimp(){

  // 少しずつ沈む
  shrimp.targetY += 0.8;

  shrimp.y +=
  (
    shrimp.targetY -
    shrimp.y
  ) * 0.15;

if(shrimp.flash>0){
shrimp.flash--;
}

if(shrimp.invincible>0){
shrimp.invincible--;
}


if(shrimp.y<60)
shrimp.y=60;

if(
shrimp.y>
canvas.height-150
){
shrimp.y=
canvas.height-150;
}

}

let lastTap=0;

canvas.addEventListener(
"touchstart",
e=>{

if(!gameStarted)
return;

const now=
Date.now();

if(
now-lastTap<250
){

shrimp.targetY -= 150;

}else{

shrimp.targetY -= 100;

}

lastTap=now;

}
);

function loop(){

if(!gameStarted){
  return;
}

drawBackground();

updateShrimp();

updateObstacles();

checkCollision();

drawObstacles();

drawShrimp();

distance+=0.2;

drawUI();

requestAnimationFrame(
loop
);

}
</script>

</body>
</html>
