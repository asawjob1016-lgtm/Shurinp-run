<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>🦐 Shrimp Run</title>

<style>

#subtitle{

<body>

<div id="menu">

<div id="title">
🦐 Shrimp Run
</div>

<div id="subtitle">
エビを操作して泳ぎ続けよう
</div>

<button onclick="startGame()">
START
</button>

</div>

<div id="gameover">

<h1>GAME OVER</h1>

<div id="scoreText"></div>

<button onclick="restartGame()">
もう一度
</button>

</div>

<canvas id="game"></canvas>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

function resize(){

canvas.width=
window.innerWidth;

canvas.height=
window.innerHeight;

groundY=
canvas.height-120;

}

window.addEventListener(
"resize",
resize
);

let groundY=0;

resize();

let running=false;

let distance=0;

let hitCount=0;

let speed=6;

let obstacleTimer=0;

let bestScore=
parseInt(
localStorage.getItem(
"shrimpBest"
)
)||0;

let shrimp={
x:140,

vy:0,

};

let obstacles=[];

let touchStartY=0;

let lastTap=0;

function startGame(){

document.getElementById(
"menu"
).style.display="none";

running=true;

distance=0;

hitCount=0;

speed=6;

obstacles=[];

shrimp.y=
canvas.height/2;

shrimp.vy=0;

requestAnimationFrame(loop);

function restartGame(){

location.reload();

}function drawShrimp(){

Math.floor(shrimp.flash/4)%2
){
return;
}

ctx.save();

ctx.translate(
shrimp.x,
shrimp.y
);

-40,-30,

);

0,

22,

);

);

ctx.stroke();

5.6
);

ctx.stroke();

48,

12,

30

72,
32

ctx.beginPath();

ctx.arc(

-6,
2.5,
0,
Math.PI*2
);

ctx.fill();

ctx.restore();

}
